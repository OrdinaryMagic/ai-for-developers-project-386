name: CI

# Run all project checks on every push (branches + tags).
# Hexlet's own check workflow lives in hexlet-check.yml and stays untouched.

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: read

jobs:
  check:
    name: Project checks (mise run check)
    runs-on: ubuntu-latest
    steps:
      # Cart #42 / ticket #49 — gitleaks-action@v2 по умолчанию сканирует
      # git diff `HEAD~1..HEAD` (с `--first-parent`). actions/checkout@v7
      # по умолчанию делает `fetch-depth: 1`, поэтому HEAD~1 в локальном
      # clone отсутствует → action падает в ошибку "ambiguous argument".
      # Передаём `fetch-depth: 0`, чтобы полная история была доступна.
      # Это добавляет ~1-2 секунды к checkout, но без него CI gitleaks
      # step падает с partial-scan.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reads mise.toml, installs the pinned versions of the tools (Node 22,
      # hk, npm:@commitlint/cli) and runs the postinstall hook which does
      # `npm install` and `hk install` (git hooks). Built-in cache keeps the
      # tool-install layer fast.
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: ""

      # Cart #42 / ticket #49 — сканируем историю репо на secret'ы
      # ДО всех остальных проверок, чтобы утечка токенов была caught
      # раньше regeneration-шагов, которые могут промаскировать fail-fast.
      #
      # Action `gitleaks/gitleaks-action@v2` (см. https://github.com/gitleaks/gitleaks-action)
      # оборачивает released binary gitleaks (8.18.4 совпадает с pin в
      # mise.toml/hk.pkl после cart-#42 wave-2). Конфиг читается из
      # `.gitleaks.toml` автоматически (см. тикет #47).
      #
      # `upload: false` потому что Code Scanning / SARIF upload ещё не
      # включены — research notes §5 рекомендуют opt-in позже.
      - name: Scan repo for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TypeSpec → OpenAPI регенерируется перед всеми проверками. Если
      # закоммиченный openapi.yaml отличается от того, что генерируется из
      # spec/*.tsp, CI падает — значит, кто-то отредактировал openapi.yaml
      # руками или не перегенерировал после правки схемы (см. AGENTS.md rule
      # #9 про generated файлы).
      - name: Regenerate OpenAPI and verify it is up-to-date
        run: |
          mise run spec
          if ! git diff --exit-code openapi.yaml > /dev/null; then
            echo "::error::openapi.yaml is out of date — regenerated from spec/ differs from committed."
            git --no-pager diff --no-color openapi.yaml
            exit 1
          fi

      # openapi.yaml → TS-типы для фронта. Шаг бежит ПОСЛЕ Regenerate OpenAPI,
      # чтобы любой drift, прилетевший из spec/*.tsp, уже был зафиксирован в
      # openapi.yaml до регенерации SDK. Если коммитированный web/src/api/sdk.ts
      # отличается от того, что выдаёт `mise run gen:sdk`, CI падает — см.
      # AGENTS.md rule #9 (web/src/api/sdk.ts is a generated artifact).
      - name: Regenerate SDK and verify it is up-to-date
        run: |
          mise run gen:sdk
          if ! git diff --exit-code web/src/api/sdk.ts > /dev/null; then
            echo "::error::web/src/api/sdk.ts is out of date — regenerated from openapi.yaml differs from committed."
            git --no-pager diff --no-color web/src/api/sdk.ts | head -200
            exit 1
          fi

      - name: Run all project checks
        run: mise run check

  # Wave C карты #26 — тикет #35. Прогоняет Playwright e2e на реальных
  # Fastify + Vite (см. `playwright.config.ts` → `webServer`-цепочка:
  # `npm run build --silent && node dist/server.js` на E2E_API_PORT=3030
  # и `npm --prefix web run dev` на 5173). Никаких моков API.
  #
  # `needs: check` (strict): если `mise run check` ломается, e2e
  # пропускается — экономит ~1 минуту установки браузера при заведомо
  # сломанных билдах. Триггер `on: push: branches: ['**']` уже стоит
  # выше, так что merge в `main` запускает оба job'а (`check` + `e2e`).
  e2e:
    name: End-to-end tests (Playwright)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # mise поставит инструменты ([tools] в mise.toml: node 22, hk,
      # commitlint) и через postinstall дернет `npm install`. Кэш
      # инструментов идёт через встроенный cache jdx/mise-action.
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: ""

      # `node-version: 22` совпадает с `engines.node` в package.json и
      # `node = "22"` в mise.toml. Отдельный step с `@v6` нужен только
      # для явного объявления версии в логах; npm-кэш берёт на себя
      # сам jdx/mise-action built-in cache, поэтому `cache: npm` тут
      # НЕ включаем — иначе будет конфликт с двумя независимыми кэшами.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Кэшируем ТОЛЬКО браузер (chromium ~150 MB), не npm-пакеты —
      # те уже закрыты mise-cache. restore-keys подхватывает частичное
      # совпадение, когда package-lock.json слегка поменялся.
      - name: Restore Playwright browser cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json', 'web/package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      # `npm ci` (а не install) — строгая проверка lockfile, ровно то,
      # что нужно для CI. Кэш от mise остаётся, но ci — fail-fast на
      # любом drift между lockfile и пакетом.
      - name: Install root npm deps
        run: npm ci --no-audit --no-fund

      # web — отдельный workspace (правило #10): свой package.json /
      # lockfile. mise postinstall ставит ТОЛЬКО root, поэтому web
      # нужен свой ci — иначе `npm --prefix web run dev` в webServer
      # пойдёт по пустому node_modules.
      - name: Install web workspace deps
        run: npm ci --prefix web --no-audit --no-fund

      # Только chromium: e2e спецификации (см. `playwright.config.ts`
      # → `projects[chromium]`) гоняются в Desktop Chrome. `--with-deps`
      # подтянет системные библиотеки (libnss3 и т.д.) на ubuntu-latest.
      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts::webServer` сам поднимает Fastify на
      # E2E_API_PORT=3030 (через `npm run build --silent && PORT=...
      # node dist/server.js`) И Vite-dev на 5173 (через
      # `npm --prefix web run dev`) и дожидается готовности обоих
      # (`url` для каждого сервиса). Нам нужно только прогнать сами
      # тесты; webServer auto-start/stop управляет процессами.
      - name: Run end-to-end tests
        env:
          CI: "1"
          E2E_API_PORT: "3030"
        run: npm run test:e2e

      # Артефакты для отладки упавших прогонов. `list` reporter в
      # CI (см. playwright.config.ts): при зелёном прогоне директории
      # может не быть — игнорируем через `if-no-files-found: ignore`.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Cart #42 / ticket #46 — билдим Dockerfile-образ на каждый push и
  # прогоняем smoke-чек против поднятого контейнера. Это страховка от
  # drift'а между `npm run build` (на котором стоит `mise run check`) и
  # реальным образом: `tsc` компилирует dist/, но только в Docker
  # срабатывают runtime ENV'и (`HOST=0.0.0.0`, prod-only deps,
  # `CMD ["node", "dist/server.js"]`).
  #
  # `needs: check` (без `: e2e`) — намеренно: e2e флакает на браузерах,
  # и docker-job должен при этом всё равно бежать, чтобы catching'ить
  # поломки Dockerfile отдельно от catching'а поломок Playwright.
  docker:
    name: Build Docker image + smoke test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # mise ставит те же тулзы, что и в check/e2e ([tools] в mise.toml:
      # node 22, hk, commitlint). Кэш jdx/mise-action переиспользует
      # слой установки инструментов между job'ами.
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: ""

      # BuildKit ≥ 23.0 даёт нам inline cache и `load` через buildx. GH
      # Actions runner уже имеет buildx-демон под капотом — этот step
      # переключает на него.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Билдим образ из root Dockerfile. Тег `booking-api:ci` — internal,
      # в registry не пушим (Deploy — отдельная карта #52). `cache-from`
      # и `cache-to: type=gha,mode=max` — это GitHub Actions layer cache
      # (скрытый GHA-volume): холодный первый push ~2 мин; с прогретым
      # кэшем — инкрементальный за ~10–30 с.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: booking-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Поднимаем контейнер в фоне на фиксированном 3030. `--env PORT=3030`
      # перебивает `ENV PORT=3000` из Dockerfile; `--publish 3030:3030`
      # биндит порт loopback'ом (без `0.0.0.0`-экспозиции в общую сеть
      # runner'а). После старта — цикл поллинга `/health` до 30 с, потом
      # основные smoke-curl'ы. `curl -fsS` падает на non-2xx, поэтому
      # на 5xx / connection refused задача падает без отдельного `set -e`.
      - name: Run container and smoke-test
        run: |
          docker run --name booking-api-ci \
            --detach \
            --env PORT=3030 \
            --publish 3030:3030 \
            booking-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3030/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3030/health | tee /tmp/health.json
          curl -fsS http://127.0.0.1:3030/ | tee /tmp/root.json
          # Cart #42 / ticket #46 — spec требует smoke по `/meeting-types`
          # в дополнение к `/` и `/health`. 200 ожидается на свежем
          # in-memory store (см. `src/routes/meeting-types.ts:51`).
          curl -fsS http://127.0.0.1:3030/meeting-types | tee /tmp/meeting-types.json

      # Чистим контейнер на любом исходе задачи — даже если smoke-curl
      # упал и job красится красным. `|| true` гасит ненулевой exit,
      # чтобы шаг cleanup никогда не маскировал настоящую ошибку.
      - name: Cleanup
        if: always()
        run: docker rm -f booking-api-ci || true
